name: Build Dev

on:
  push:
    branches:
      - 'dev'

jobs:
  build:
    runs-on: self-hosted
    steps:
        
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Load Env Variables from gradle.properties
        run: ./updateenv.sh
        
      - name: Dump Env for futher work
        run: printenv

      - name: chmod +x ./gradlew
        run: chmod +x ./gradlew
        
      - name: Build with Gradle
        run: ./gradlew build

      - name: chmod +x ./updateenv.sh
        run: chmod +x ./updateenv.sh