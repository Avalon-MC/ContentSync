name: Build Dev

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'

jobs:
  build:
    runs-on: self-hosted
    steps:
        
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set env MCMOD_VERSION
        run: echo "MCMOD_VERSION=$(cat gradle.properties | grep "mod_version" | cut -d'=' -f2)" >> $GITHUB_ENV
        
      - name: Set env MCMOD_ID
        run: echo "MCMOD_ID=$(cat gradle.properties | grep "mod_id" | cut -d'=' -f2)" >> $GITHUB_ENV
        
      - name: Print Mod Id
        run: echo $MCMOD_ID
      - name: Print Mod Version
        run: echo $MCMOD_VERSION

      - name: chmod +x ./gradlew
        run: chmod +x ./gradlew
        
      - name: Build with Gradle
        run: ./gradlew build